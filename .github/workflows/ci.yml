---
name: CI

on:
  pull_request:
  # Codecov compares pull requests against the coverage of main.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main needs its coverage report, so only pull requests cancel
  # outdated runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
      - run: bundle exec rubocop

  actions:
    name: Lint workflows
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # Code smells (complexity, duplication, nesting) via Qlty. Git-aware: only
  # smells introduced by the pull request compared to main fail the job.
  qlty:
    name: Code smells
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install qlty
        uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0

      - name: Lint via qlty plugins
        run: qlty check --all

      - name: Report code smells
        if: github.event_name != 'pull_request'
        run: qlty smells --all --no-snippets

      - name: Report new code smells
        if: github.event_name == 'pull_request'
        run: qlty smells --upstream origin/main --no-snippets

      - name: Fail on new code smells
        if: github.event_name == 'pull_request'
        run: |
          count=$(qlty smells --upstream origin/main --json --quiet 2>/dev/null | jq length)
          if [ "$count" -gt 0 ]; then
            echo "::error::qlty found $count new code smell(s) compared to main"
            exit 1
          fi

  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage/coverage.xml

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It is skipped along with the tests, and passes with a warning
  # if Codecov doesn't report in time.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request' && needs.test.result == 'success'
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [lint, actions, qlty, test, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
