---
codecov:
  # The Coverage job of the CI workflow waits for the Codecov checks, so
  # Codecov must not wait for the other checks in turn.
  require_ci_to_pass: false
  notify:
    wait_for_ci: false
    # The tests run on three Ruby versions and each one uploads its coverage.
    # Codecov reports only once all three uploads arrived.
    after_n_builds: 3

coverage:
  status:
    project:
      default:
        # Every line of the gem is tested. spec_helper.rb enforces the same.
        target: 100%
    patch:
      default:
        # Every line a pull request changes must be tested.
        target: 100%
